[project]
name = "tailucas-pylib"
version = "0.7.7"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "python-json-logger>=4.1.0",
    "pytz>=2025.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.40.21", "onepassword-sdk>=0.3.1", "onepasswordconnectsdk>=1.5.1"]
creds = ["onepassword-sdk>=0.3.1", "onepasswordconnectsdk>=1.5.1"]
dto = ["pydantic>=2.11.7"]
monitoring = ["cronitor>=4.7.1", "sentry-sdk>=2.35.1"]
mq = [
    "pika>=1.3.2",
    "pyzmq>=27.0.2",
    "simplejson>=3.20.1",
    "u-msgpack-python>=2.8.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "mypy"]
test = ["coverage[toml]", "hatch", "pytest", "pytest-cov", "pytest-mock"]

[tool.uv]
default-groups = ["lint"]

[tool.coverage.run]
source = ["src/tailucas_pylib"]
branch = true
omit = ["src/tailucas_pylib/tools/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.hatch-test]
dependencies = [
    "coverage[toml]",
    "pytest",
    "pytest-cov",
    "pytest-mock",
]

[tool.hatch.envs.hatch-test.env-vars]
# keep per-environment coverage data files
COVERAGE_FILE = ".coverage.{env_name}"

[tool.hatch.envs.hatch-test.scripts]
run = "pytest -v"

# 2^5 = 32 environments, one per combination of extras
[[tool.hatch.envs.hatch-test.matrix]]
aws = ["no-aws", "aws"]
creds = ["no-creds", "creds"]
dto = ["no-dto", "dto"]
monitoring = ["no-monitoring", "monitoring"]
mq = ["no-mq", "mq"]

[tool.hatch.envs.hatch-test.overrides.matrix.aws]
features = [{ value = "aws", if = ["aws"] }]

[tool.hatch.envs.hatch-test.overrides.matrix.creds]
features = [{ value = "creds", if = ["creds"] }]

[tool.hatch.envs.hatch-test.overrides.matrix.dto]
features = [{ value = "dto", if = ["dto"] }]

[tool.hatch.envs.hatch-test.overrides.matrix.monitoring]
features = [{ value = "monitoring", if = ["monitoring"] }]

[tool.hatch.envs.hatch-test.overrides.matrix.mq]
features = [{ value = "mq", if = ["mq"] }]

[project.scripts]
aws_configure = "tailucas_pylib.tools.aws_configure:main"
config_interpol = "tailucas_pylib.tools.config_interpol:main"
cred_tool = "tailucas_pylib.tools.cred_tool:main"
yaml_interpol = "tailucas_pylib.tools.yaml_interpol:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["tailucas_pylib"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
no_implicit_optional = false
warn_return_any = false
warn_unused_ignores = false
show_error_codes = true
